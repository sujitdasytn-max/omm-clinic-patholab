        </aside>

        <form class="form-card" id="appointmentForm">
          <div class="form-grid">
            <div class="field">
              <label for="patientName">Patient Name *</label>
              <input id="patientName" name="patientName" autocomplete="name" required placeholder="Enter full name">
            </div>
            <div class="field">
              <label for="phone">Mobile Number *</label>
              <input id="phone" name="phone" type="tel" inputmode="tel" required placeholder="Enter mobile number">
            </div>
            <div class="field full">
              <label for="doctor">Select Doctor *</label>
              <select id="doctor" name="doctor" required>
                <option value="">Choose a doctor</option>
                <option>Dr. Manas Ranjan Pattnaik — MD Medicine</option>
                <option>Dr. Nalinikant Panda — MD Gynaecology</option>
                <option>Dr. Amit Kumar Mohanty — MBBS</option>
                <option>Dr. Kalinga Bijay Mishra — Physiotherapy</option>

            </div>
            <div class="field">
              <label for="date">Preferred Date *</label>
              <input id="date" name="date" type="date" required>
            </div>
            <div class="field">
              <label for="time">Preferred Time</label>
              <select id="time" name="time">
                <option>Any available time</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
              </select>
            </div>
            <div class="field full">

              <textarea id="reason" name="reason" placeholder="Optional — briefly describe your appointment or test enquiry"></textarea>
            </div>

              <button class="btn" type="submit">Send Request on WhatsApp ↗</button>
              <p class="form-note">Please avoid entering highly sensitive medical details in this enquiry. This is a request, not a confirmed appointment.</p>

          </div>

<footer>

<a class="whatsapp-float" href="https://wa.me/917735721015?text=Hello%20OMM%20Clinic%2C%20I%20have%20an%20enquiry." target="_blank" rel="noopener">WhatsApp ↗</a>

<script>
const WHATSAPP_NUMBER = "917735721015";

document.getElementById("year").textContent = new Date().getFullYear();

const menuToggle = document.getElementById("menuToggle");
const navlinks = document.getElementById("navlinks");

menuToggle.addEventListener("click", function() {
  navlinks.classList.toggle("open");
});

navlinks.querySelectorAll("a").forEach(function(link) {
  link.addEventListener("click", function() {
    navlinks.classList.remove("open");
  });
});

const doctorSelect = document.getElementById("doctor");

document.querySelectorAll(".doctor-book").forEach(function(button) {
  button.addEventListener("click", function() {
    doctorSelect.value = button.dataset.doctor;
    document.getElementById("appointment").scrollIntoView({behavior:"smooth"});
    setTimeout(function() {
      document.getElementById("patientName").focus({preventScroll:true});
    }, 400);
  });
});

const dateInput = document.getElementById("date");
const now = new Date();
const localToday = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
  .toISOString().slice(0,10);
dateInput.min = localToday;

document.getElementById("appointmentForm").addEventListener("submit", function(event) {
  event.preventDefault();

  if (!this.reportValidity()) return;

  const name = document.getElementById("patientName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const doctor = doctorSelect.value;
  const date = dateInput.value;
  const time = document.getElementById("time").value;
  const reason = document.getElementById("reason").value.trim() || "Not specified";

  const message = [
    "Hello OMM Clinic & Patho Lab, I would like to request an appointment.",
    "",
    "Patient Name: " + name,
    "Mobile Number: " + phone,
    "Preferred Doctor: " + doctor,
    "Preferred Date: " + date,
    "Preferred Time: " + time,
    "Reason / Test Enquiry: " + reason,
    "",
    "Please confirm the doctor's availability. I understand this is a request and not a confirmed appointment."
  ].join("\n");

  window.open(
    "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message),
    "_blank"
  );
});
</script>
